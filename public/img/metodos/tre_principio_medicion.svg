<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="80" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1f2937">Tomografía de Resistividad Eléctrica (TRE): principio de medición</text>
  <text x="70" y="125" font-family="Arial, sans-serif" font-size="24" fill="#6b7280">Se inyecta corriente en el terreno y se mide la diferencia de potencial para estimar la resistividad aparente.</text>
  <line x1="80" y1="360" x2="1320" y2="360" stroke="#475569" stroke-width="5"/>
  <rect x="80" y="365" width="1240" height="130" fill="#e2e8f0"/><text x="105" y="405" font-family="Arial" font-size="20" fill="#1f2937">Capa superficial</text>
  <rect x="80" y="500" width="1240" height="130" fill="#bfdbfe"/><text x="105" y="540" font-family="Arial" font-size="20" fill="#1f2937">Zona más conductiva</text>
  <rect x="80" y="640" width="1240" height="130" fill="#fed7aa"/><text x="105" y="680" font-family="Arial" font-size="20" fill="#1f2937">Zona más resistiva</text>
  <g font-family="Arial" font-size="22" font-weight="700">
    <polygon points="250,320 232,360 268,360" fill="#dc2626"/><text x="180" y="298" fill="#dc2626">A: corriente +</text>
    <polygon points="520,320 502,360 538,360" fill="#2563eb"/><text x="455" y="298" fill="#2563eb">M: potencial</text>
    <polygon points="880,320 862,360 898,360" fill="#2563eb"/><text x="815" y="298" fill="#2563eb">N: potencial</text>
    <polygon points="1150,320 1132,360 1168,360" fill="#dc2626"/><text x="1075" y="298" fill="#dc2626">B: corriente −</text>
  </g>
  <path d="M250 360 C430 690, 970 690, 1150 360" fill="none" stroke="#dc2626" stroke-width="5"/>
  <path d="M320 390 C460 625, 940 625, 1080 390" fill="none" stroke="#ea580c" stroke-width="4"/>
  <polygon points="1134,356 1160,360 1140,376" fill="#dc2626"/>
  <text x="610" y="710" font-family="Arial" font-size="20" fill="#ea580c">líneas de corriente eléctrica</text>
  <rect x="585" y="180" width="230" height="65" rx="18" fill="#fff" stroke="#2563eb" stroke-width="3"/>
  <text x="638" y="220" font-family="Arial" font-size="24" font-weight="700" fill="#2563eb">ΔV medido</text>
  <line x1="520" y1="320" x2="650" y2="245" stroke="#2563eb" stroke-width="3"/><line x1="880" y1="320" x2="750" y2="245" stroke="#2563eb" stroke-width="3"/>
  <rect x="890" y="155" width="400" height="130" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="915" y="198" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937">Resistividad aparente</text>
  <text x="915" y="250" font-family="Arial" font-size="40" font-weight="700" fill="#2563eb">ρa = K · ΔV / I</text>
  <text x="915" y="275" font-family="Arial" font-size="18" fill="#6b7280">K depende del arreglo de electrodos</text>
</svg>