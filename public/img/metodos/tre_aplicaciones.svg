  <rect x="520" y="195" width="360" height="105" rx="18" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="540" y="228" font-family="Arial" font-size="22" font-weight="700" fill="#16a34a">Geotecnia</text><text x="540" y="260" font-family="Arial" font-size="18" fill="#1f2937">rellenos, contactos litológicos,</text><text x="540" y="283" font-family="Arial" font-size="18" fill="#1f2937">roca alterada</text>
