<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="80" font-family="Arial" font-size="40" font-weight="700" fill="#1f2937">Qué puede revelar una TRE en proyectos de ingeniería y geofísica aplicada</text>
  <text x="70" y="125" font-family="Arial" font-size="24" fill="#6b7280">La interpretación depende del contexto geológico, calibración y objetivos del estudio.</text>
